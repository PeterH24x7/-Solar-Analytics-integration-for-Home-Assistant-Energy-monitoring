# -----------------------------------------------------------------------------
# >>> RELEASE 11 FINAL <<< SOLAR_ANALYTICS_3PHASE.YAML SOLUTION
#
# Release 11 adds resilient token, 5min, live and hourly data recovery from outages,
# retries, delayed publication and startup/reload conditions with recovery diagnostics.
#
# SOLAR ANALYTICS integration for Home Assistant Energy Monitoring
#
# Configurations:
#     [THIS FILE] - solar_analytics_3phase.yaml - consumed and generated sensors only.
#                 - solar_analytics_battery.yaml [NEW 27-Jan-25] - includes consumed, generated
#                     and battery sensors.
#                 - solar_analytics.yaml - consumed and generaged, plus load sensors for 
#                     hot_water, air_conditioner, ev_charger and stove.
#                     Note: other known, but not implemented, SA load types include load_lighting
#                     load_tenant and load_garage.
#                 - solar_analytics_advanced.yaml - sensors as per solar_analytics, plus
#                     load energy broken into imported and generated sources.
# 
# Developed by Peter Hormann and with thanks to Glen S and Roving-Ronin for their contributions.
#
# Created: 7-Jan-2022
#
# Last updated: 24-Jul-26 as Release 11 - see update notes below.
#
# Updates:
#     16-Jan-2022 - INITIAL RELEASE 1
#                   ...
#     2022 - 2024 - Old redundant release notes deleted.
#                   ...
#       10-Feb-25 - RELEASE 9 - MINOR ADDITION TO HISTORY SENSOR ONLY.
#                 - Added new history sensor - sa_data_by_5min_history_imported_exported. Included as
#                   new attribute in sa_todays_energy_history.
#                 - Modified sa_data_by_5min_history_energy_generated to only include +ve values.
#                 - Minor code redo to align with solar_analytics_battery.yaml functioning.
#                 - Added last5min energy attribute to sa_todays_xloadx_total and
#                   sa_todays_energy_imported/exported sensors. Units are Wh.
#       25-Jun-26 - RELEASE 10 - MAJOR INTERNAL OVERHAUL, BUT EXTERNALLY UNCHANGED BEHAVIOUR
#                 - Migrated to modern template sensor patterns for future HA compatibility.
#                 - Fixed generation allocation logic to suppress negative xx_energy_last5min 
#                   generation attributes, ensuring physically valid solar contribution and more 
#                   accurate cost attribution.
#                 - Enhanced history sensors to mask invalid periods (all-zero/none data) by 
#                   persisting and reusing the last valid value, improving continuity and visual 
#                   accuracy of energy trends
#                 - Added change-guard logic to prevent unnecessary and repeated state updates.
#                 - Improved reset detection with large drop threshold (old - new > RESET_THRESHOLD)
#                   check. Ensures reliable midnight resets for continuous-load systems while 
#                   ignoring small drift/rounding noise.
#                 - Added numeric-safe fallback handling to ensure valid sensor states during 
#                   startup.
#                 - Eliminated template loops using `this.state` and state-preserving update logic
#                   for non-raw energy (e.g. sa_todays_...) and power (e.g. sa_consumption_power) 
#                   sensors.
#                 - Introduced monotonic decrease protection for derived total_increasing sensors 
#                   (import/export/battery splits) to prevent small decreases caused by rounding, unit 
#                   conversion (Wh ↔ kWh) and calculation drift.
#                 - Improved overall data validation, stability and resilience across all sensors.
#                 - Maintained full backward compatibility of entity names, outputs and dashboards.
#       24-Jul-26 - RELEASE 11 - TOKEN REFRESH, LIVE DATA, 5MIN and HOUR DATA RESILIENCE
#                 - Improved resilience against Solar Analytics API outages, token refresh failures,
#                   delayed/missing 5-minute data publication, live data publication delays and
#                   associated HA startup/reload conditions.
#                 - Authentication token - sa_auth_token_cached:
#                   - Added cached token preservation with automatic retry, recovery and failure
#                     diagnostics.
#                   - Records refresh failure reason, retry activity, recovery timestamps,
#                     failure duration and refresh failure counts as attributes.
#                 - 5-minute data - sa_data_by_5min_...:
#                   - Added sa_data_by_5min_time_stamp_cached to preserve the last valid
#                     5-minute timestamp during Solar Analytics API outages, delayed data publication
#                     events and Home Assistant startup/reload conditions.
#                   - Added automatic retry and recovery logic for both unavailable timestamps and
#                     stale 5-minute data publication events.
#                   - Added age-based stale timestamp detection to identify delayed publication of
#                     5-minute data before a timestamp continuity gap occurs.
#                   - Supports up to 3 retry attempts per failed 5-minute refresh cycle, with
#                     automatic recovery when data publication resumes.
#                   - Distinguishes between stale and unavailable refresh failures while providing a
#                     common outage tracking, retry and recovery model.
#                   - Records failure reason, retry activity, recovery status, failure/recovery
#                     timestamps, outage gap statistics and timestamp continuity diagnostics as
#                     sensor attributes.
#                   - Distinguishes between recovered outages and permanently lost 5-minute
#                     intervals resulting from extended publication failures.
#                 - Live data - sa_live_site_data_...:
#                   - Added live-data timestamp continuity for derived power sensors, preventing
#                     temporary unavailable states during known top-of-hour publication gaps.
#                   - Added scheduled-poll-aware live-data recovery logic to bridge temporary
#                     publication gaps, stale timestamp responses and short outages.
#                   - Added expected live-data timestamp preservation using a breadcrumb-based
#                     continuity model to bridge temporary publication gaps and outages while
#                     preserving timestamp continuity.
#                   - Added live-data failure reason, stale timestamp, recovery tracking and
#                     synthetic timestamp diagnostics, including outage counts, recovery
#                     timestamps and synthetic timestamp generation counts.
#                 - Hourly data - sa_data_by_hour_...:
#                   - For sa_todays_energy_generated_expected_total, now manages 
#                     sa_data_by_hour_time_stamp and sa_data_by_hour_generated_expected 
#                     unavailability (often occurs after midnight and before the early morning 
#                     reset), then the previous value is retained and the time_stamp attribute 
#                     set to the last update time. If the update of the value or the time_stamp 
#                     fails, then these are reported true by attributes update_failed and 
#                     timestamp_failed respectively.
#                   - sa_data_by_hour_generated_expected resets to zero on first update
#                     after midnight.
#                 - sa_status:
#                   * POTENTIAL breaking change for user configurations that directly use the state of 
#                     sa_status, which no longer returns the status text; instead use sa_mer_status.
#                   - Changed sa_status state to a refresh timestamp to guarantee detectable updates; 
#                     mer_status/dashboard_status/mer_percentage remain unchanged via attributes and 
#                     now include a time_stamp attribute.
#
# This code is provided as-is and without any warrantee or guarantees.
# Further public contributions and enhancements are welcomed.
#
# INSTALLATION - NEW:
#   1. Copy this yaml file to the Home Assistant (HA) config folder.
#   2. Include this file name as a package in the HA configuration.yaml.
#      For example -
#        packages:
#          pack_1: !include solar_analytics.yaml
#   3. Define sa_username, sa_password and sa_site_id (e.g. 36304) in the secrets.yaml file (see
#      example on github).
#   4. Using HA Developer Tools check the configuration and restart.
#   5. Go to HA Settings and then search for “Energy Configuration” to make the changes to the Energy
#      Dashboard Configuration. #nter the details for:
#      > Grid consumption - as sa_todays_energy_imported
#      > Return to grid - as sa_todays_energy_exported
#      > Solar production - as sa_todays_energy_generated_total
#   6. Add the energy load sensors to the HA Energy Dashboard as "Monitor Individual Devices".
#   7. If all is working is correctly, the Energy Dashboard should start populating data within
#      a couple of hours.
#   8. If the HA Dashboard "Grid Consumption" and "Return to grid" are configured with energy unit pricing
#      details, then the sa_todays_energy_imported_cost and sa_todays_energy_exported_compensation sensors
#      will be auto-created by the Energy Dashboard. These sensors can be found as hidden Entities
#      (which can't be changed or deleted). If all good, then the sa_todays_energy_import_rate
#      (daily av. $/kWh), sa_todays_energy_export_rate (daily av. $/kWh) and
#      sa_todays_energy_total_net_cost ($) should work without further config. If no pricing
#      is set, then optionally delete these 3x sensors from the configuration.
#   9. Enjoy!
#
# UPGRADING - FROM A PREVIOUS VERSION:
#   This upgrade should not break the sensors created in a previous versions. It's recommended that the
#   previous version solar_analytics.yaml should be deleted/renamed, HA restarted, the new solar_analytics.yaml
#   copied to the <config> folder and then HA restarted again. The sensors should start repopulating
#   within their refresh timecycles. If any duplicate sensors happen to be created, go to HA Settings ->
#   Devices & Services -> Entities and delete any "sa_..." prefixed sensors showing as unavailable or
#   disabled, then restart once more and the correctly named sensor and its data should be restored
#   to normal. Alternatively go to 'Developer Tools -> Actions' and select 'Purge entities,
#   recorder purge.entities' and then 'entity_id' and then enter a list of entities needing to be purged.
#
# If you find my work useful, please buy me a coffee ... thank you!
#   https://www.buymeacoffee.com/peter24x7
#
# Reference for more information and updates:
#   https://github.com/PeterH24x7/-Solar-Analytics-integration-for-Home-Assistant-Energy-monitoring
#
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# INPUT_TEXT helper
input_text:
  # Define the Solar Analytics site_id value is required in URLs used in gets below - e.g. 36304.
  # See the Solar Analytics user portal to find your site id or see the collected sa_site_list
  # attributes as defined below.
  sa_site_id:
    initial: !secret sa_site_id

# -----------------------------------------------------------------------------
# INPUT_DATETIME helper
input_datetime:
  # Helper records the timestamp of each scheduled 5-minute data refresh attempt.
  # Updated by automation sa_data_by_5min_trigger after each scheduled poll attempt.
  # Not used for data storage or reporting. Acts as an internal retry marker only.
  #
  # Used by sa_data_by_5min_time_stamp_cached to:
  #   - detect scheduled poll attempts during outages
  #   - reset retry cycle counters
  #   - trigger new retry cycles after failed polls
  #   - support extended outage recovery logic
  #
  sa_data_by_5min_last_poll_attempt:
    has_date: true
    has_time: true

# -----------------------------------------------------------------------------
# TIMERS
timer:
  # Timer for triggering refresh before token expiry.
  sa_token_expiry_timer:
    duration: 0
    icon: mdi:clock-check
    restore: true

  # Timer for retrying failed token refreshes.
  sa_token_retry_timer:
    duration: 0
    icon: mdi:timer-refresh
    restore: true

  # Timer for retrying failed 5 minute data refreshes.
  sa_data_by_5min_retry_timer:
    duration: 0
    icon: mdi:timer-refresh
    restore: false

# -----------------------------------------------------------------------------
# AUTOMATIONS
automation:
  # Automation to restart timer when a valid authentication token is refreshed.
  - id: "sa_token_expiry_update"
    alias: SA Token Expiry update
    description: "Restart token expiry timer when a valid token is cached."
    trigger:
      - platform: state
        entity_id:
          - sensor.sa_auth_token_cached
        for:
          hours: 0
          minutes: 0
          seconds: 5
    condition:
      - condition: template
        value_template: >
          {{- states('sensor.sa_auth_token_cached')|int(none) is number
                and state_attr('sensor.sa_auth_token_cached','token') is string
                and state_attr('sensor.sa_auth_token_cached','token')|length > 20 -}}
    action:
      - service: timer.start
        data:
          duration: "{{- states('sensor.sa_auth_token_cached')|int(0) -}}"
        target:
          entity_id: timer.sa_token_expiry_timer
    mode: single

  # Automation to refresh the authentication token when the timer expires.
  - id: "sa_token_refresh_on_timer_expiry"
    alias: SA Token refresh on Timer expiry
    description: "Refresh the token when the timer expires"
    trigger:
      - platform: state
        entity_id:
          - timer.sa_token_expiry_timer
        to: idle
        for:
          hours: 0
          minutes: 0
          seconds: 5
    condition: []
    action:
      - service: homeassistant.update_entity
        data: {}
        target:
          entity_id: sensor.sa_auth_token
    mode: single

  # Automation to start a retry timer after a failed token refresh.
  - id: "sa_token_refresh_failure_retry_start"
    alias: SA Token Refresh Failure Retry Start
    description: "Start 5 minute token refresh retry timer after the raw token refresh fails."
    trigger:
      - platform: state
        entity_id: sensor.sa_auth_token
        to: "unavailable"
        for:
          seconds: 10
      - platform: state
        entity_id: sensor.sa_auth_token
        to: "unknown"
        for:
          seconds: 10
      - platform: state
        entity_id: sensor.sa_auth_token
        to: "none"
        for:
          seconds: 10
    condition:
      - condition: state
        entity_id: timer.sa_token_retry_timer
        state: "idle"
    action:
      - service: timer.start
        target:
          entity_id: timer.sa_token_retry_timer
        data:
          duration: "00:05:00"
    mode: restart

  # Automation to retry token refresh on retry timer expiry, restart the retry timer 
  # on failure.
  - id: "sa_token_retry_refresh"
    alias: SA Token Retry Refresh
    description: "Retry Solar Analytics token refresh every 5 minutes until successful."
    trigger:
      - platform: state
        entity_id: timer.sa_token_retry_timer
        to: "idle"
        for:
          seconds: 5
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.sa_auth_token
      - delay:
          seconds: 15
      - if:
          - condition: template
            value_template: >-
              {{- states('sensor.sa_auth_token') in
                  ['unavailable','unknown','none',''] -}}
        then:
          - service: timer.start
            target:
              entity_id: timer.sa_token_retry_timer
            data:
              duration: "00:05:00"
    mode: single

  # Automation to cancel the retry timer on token refresh success.
  - id: "sa_token_retry_success"
    alias: SA Token Retry Success
    description: "Cancel failed-token retry timer after token refresh succeeds."
    trigger:
      - platform: state
        entity_id: sensor.sa_auth_token_cached
    condition:
      - condition: template
        value_template: >-
          {%- set was_failed =
                trigger.from_state.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
          {%- set failed =
                state_attr('sensor.sa_auth_token_cached', 'refresh_failed')
                  in [true,'true','True'] -%}
          {{- was_failed and not failed -}}
    action:
      - service: timer.cancel
        target:
          entity_id: timer.sa_token_retry_timer
    mode: single

  # Automated trigger for sa_data_by_5min_... sensors - fires every 5 minutes.
  ##### In case of network problems, try adding 1min extra offset as follows:
  ##### >>>>> condition: "{{- ( (now().minute + 1) is divisibleby(5) ) and ( ( (now().second // 10) + (states('input_text.sa_site_id')|int(0) % 6) ) == 5 ) -}}"
  - id: "sa_data_by_5min_trigger"
    alias: SA Data by 5min Trigger
    description: "Every 5 minutes trigger offset by 3 minutes (e.g. 3, 8, 13) plus offset by multiples of 10s of seconds"
    trigger:
      - platform: time_pattern
        seconds: "/10"
    condition: >-
      {{- ( (now().minute + 2) is divisibleby(5) ) 
          and ( ( ( now().second // 10) + (states('input_text.sa_site_id')|int(0) % 6) ) == 5 ) -}}
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.sa_data_by_5min_time_stamp
      - delay:
          seconds: 20
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sa_data_by_5min_last_poll_attempt
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    mode: single

  # Automation to start retry timer after failed 5 minute data refresh.
  # Start retry timer immediately when the raw 5 minute timestamp becomes
  # unavailable. Failure accounting is deferred until 3x retry attempts complete.
  # Will try 3x again if next schedule update also fails.
  - id: "sa_data_by_5min_retry_start"
    alias: SA Data by 5min Retry Start
    description: "Start 1 minute retry timer after failed 5 minute data refresh."
    trigger:
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        to: "unavailable"
        for:
          seconds: 10
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        to: "unknown"
        for:
          seconds: 10
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        to: "none"
        for:
          seconds: 10
      # New scheduled 5-minute poll attempt marker.
      # This fires even when the raw timestamp remains continuously unavailable.
      - platform: state
        entity_id: input_datetime.sa_data_by_5min_last_poll_attempt
    condition:
      - condition: template
        value_template: >-
          {{- states('timer.sa_data_by_5min_retry_timer') != 'active'
                and (
                      states('sensor.sa_data_by_5min_time_stamp')
                        in ['unavailable','unknown','none']
                      or (states('sensor.sa_data_by_5min_time_stamp')
                            not in ['unavailable','unknown','none','']
                        and ((as_timestamp(now())
                                  - as_timestamp(states('sensor.sa_data_by_5min_time_stamp'))
                              ) / 60  ) >= 6 )) -}}
    action:
      - service: timer.start
        target:
          entity_id: timer.sa_data_by_5min_retry_timer
        data:
          duration: "00:01:00"
    mode: restart

  # Automation to retry failed 5 minute data refresh, up to 3 attempts.
  - id: "sa_data_by_5min_trigger_retry"
    alias: SA Data by 5min Trigger Retry
    description: "Retry failed 5 minute data refresh every minute up to 3 times."
    trigger:
      - platform: state
        entity_id:
          - timer.sa_data_by_5min_retry_timer
        to: idle
        for:
          hours: 0
          minutes: 0
          seconds: 5
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.sa_data_by_5min_time_stamp
      - delay:
          seconds: 10
      - if:
          - condition: template
            value_template: >-
              {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
              {%- set stale = ts not in ['unknown','unavailable','none','']
                    and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
              {{- state_attr('sensor.sa_data_by_5min_time_stamp_cached',
                  'update_failed') in [true,'true','True']
                and state_attr('sensor.sa_data_by_5min_time_stamp_cached',
                  'update_failed_last_retry_count')|int(0) < 3
                and (ts in ['unknown','unavailable','none',''] or stale) -}}
        then:
          - service: timer.start
            target:
              entity_id: timer.sa_data_by_5min_retry_timer
            data:
              duration: "00:00:30"
    mode: single

  # Automation to cancel 5 minute data retry timer after successful refresh.
  - id: "sa_data_by_5min_retry_success"
    alias: SA Data by 5min Retry Success
    description: "Cancel 5 minute data retry timer after successful data refresh."
    trigger:
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp_cached
    condition:
      - condition: template
        value_template: >-
          {%- set was_failed =
                trigger.from_state.attributes.update_failed|default(false)
                in [true,'true','True'] -%}
          {%- set failed =
                state_attr('sensor.sa_data_by_5min_time_stamp_cached',
                          'update_failed')
                in [true,'true','True'] -%}
          {{- was_failed and not failed -}}
    action:
      - service: timer.cancel
        target:
          entity_id: timer.sa_data_by_5min_retry_timer
    mode: single

  # Automated trigger for sa_live_site_data_... sensors - fires every minute.
  - id: "sa_live_site_data_trigger"
    alias: SA Live Site Data Trigger
    description: "Every 1 minute trigger offset by 30 seconds plus offset by multiples of 5 seconds"
    trigger:
      - platform: time_pattern
        seconds: "/5"
    condition: >-
      {{- ( (now().second // 10) >= 3 ) 
          and ( (now().second // 5) + (states('input_text.sa_site_id')|int(0) % 6) == 11 ) -}}
    action:
      - service: homeassistant.update_entity
        data: {}
        target:
          entity_id: sensor.sa_live_site_data_time_stamp
      # Allow REST update to complete before evaluating expected timestamp.
      - delay:
          seconds: 5
      # Marker event used by sa_live_site_data_time_stamp_expected.
      - event: sa_live_site_data_poll_completed
        event_data:
          source: sa_live_site_data_trigger
    mode: single

  # Automated trigger for sa_data_by_hour_... sensors fires every hour.
  - id: "sa_data_by_hour_trigger"
    alias: SA Data By Hour Trigger
    description: "At 11 minutes past the hour trigger plus offset by multiples of 10s of seconds"
    trigger:
      - platform: time_pattern
        minutes: "11"
        seconds: "/10"
    condition: >-
      {{- ( (now().second // 10) + (states('input_text.sa_site_id')|int(0) % 6) ) == 5 -}}
    action:
      - service: homeassistant.update_entity
        data: {}
        target:
          entity_id: sensor.sa_data_by_hour_time_stamp
    mode: single

  # On 5min data recovery, refresh status sensor and recover hourly sensors if required.
  - id: "sa_data_refresh_on_5min_recovery"
    alias: SA Data Refresh On 5 Minute Recovery
    description: >-
      Refresh status sensor and recover hourly data sensors
      when 5 minute data recovers after an outage.
    trigger:
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        from: "unavailable"
        not_to:
          - "unknown"
          - "unavailable"
          - "none"
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        from: "unknown"
        not_to:
          - "unknown"
          - "unavailable"
          - "none"
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
        from: "none"
        not_to:
          - "unknown"
          - "unavailable"
          - "none"
    action:
      - delay:
          seconds: 30
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.sa_status
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{- states('sensor.sa_data_by_hour_time_stamp')
                      in ['unavailable', 'unknown', 'none']
                    or states('sensor.sa_data_by_hour_generated_expected')
                      in ['unavailable', 'unknown', 'none'] -}}
            sequence:
              - service: homeassistant.update_entity
                target:
                  entity_id:
                    - sensor.sa_data_by_hour_time_stamp
                    - sensor.sa_data_by_hour_generated_expected
    mode: single

  # Home Assistant manual trigger to refresh all SA get sensors.
  - id: "sa_refresh_all_rest_gets"
    alias: SA Refresh all REST data gets
    description: "Useful automation to force manual refresh all REST data gets."
    trigger:
      - platform: event
        event_type: sa_refresh_all_rest_gets
    action:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.sa_auth_token
            - sensor.sa_site_list
            - sensor.sa_status
            - sensor.sa_data_by_5min_time_stamp
            - sensor.sa_live_site_data_time_stamp
            - sensor.sa_data_by_hour_time_stamp
    mode: single

# -----------------------------------------------------------------------------
# REST GETS
rest:
  #
  # Solar Analytics - rest get of latest token using username and password credentials.
  # Auto updates every 2 hours, else on sa_token_expiry_timer via automation.
  - resource: "https://portal.solaranalytics.com.au/api/v3/token"
    authentication: basic
    username: !secret sa_username
    password: !secret sa_password
    scan_interval: 7200
    sensor:
      - name: sa_auth_token
        unique_id: sa_auth_token
        value_template: "{{- value_json['duration'] -}}"
        json_attributes:
          - "token"
          - "expires"
        availability: >-
          {{- (value_json is defined and value_json.token is defined) -}}

  #
  # Solar Analytics - get the site details associated with the given user account login.
  # Updated every hour.
  #
  # Note: assumes only a single device per account, there could be a second device (e.g. replaced
  # device due to fault/upgrade) at $.data.[1]
  - resource: "https://portal.solaranalytics.com.au/api/v3/site_list?hardware=true&capacity=true&subscription=true"
    headers:
      Authorization: >-
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 3600
    sensor:
      - name: sa_site_list
        unique_id: sa_site_list
        value_template: "{{- now() -}}"
        json_attributes_path: "$.data.[0]"
        json_attributes:
          - "e_status"
          - "fault_class"
          - "fault_id*"
          - "has_pv"
          - "mer_status"
          - "overall_status"
          - "retailer_user"
          - "s_cli_site_name"
          - "site_id"
          - "site_inactive"
          - "capacity"
          - "devices"
          - "sub_type"
        availability: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {{- (value_json.data|list|length) > 0 -}}
          {%- else -%}
            false
          {%- endif -%}

  #
  # Solar Analytics - get the site status for the specified site_id.
  # Updated every hour and on failure recovery.
  #
  # 30-Oct-24 - extra attributes - not always available.
  #   Decided against use of unsupported v4 (not in public API, reporting showed
  #   some inconsistency w/ v3).
  #
  # 24-Jul-26 - sa_status state changed to current time of update to guarantee
  #   refresh (else no data changes). Attribute mer_status as used in sensor 
  #   sa_mer_status now with new state as its time_stamp attribute.
  #   Also applies to sensors sa_dashboard_status and sa_mer_percentage.
  #
  - resource_template:
      https://portal.solaranalytics.com.au/api/v3/site_status/{{-
      states('input_text.sa_site_id')
      -}}
    headers:
      Authorization: >-
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 3600
    sensor:
      - name: sa_status
        unique_id: sa_status
        value_template: >-
          {{- now().strftime('%Y-%m-%d %H:%M:%S') -}}
        json_attributes_path: "$.data"
        json_attributes:
          - "dashboard_status"
          - "mer_status"
          - "mer_text"
          - "mer_percentage"

          - "fault_status"
          - "fault_type"
          - "fault_text"

          - "action_type"
          - "action_text"

          - "event_id"
          - "event_list"
        availability: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {{- (value_json.data.mer_status is defined) -}}
          {%- else -%}
            false
          {%- endif -%}

  #
  # Solar Analytics - get the site fault status for the specified site_id.
  # Updated every 5 minutes.
  #
  # Note: this is not a published API 'get', but is used by the SA portal to show a 
  # sites fault status (if any).
  #
  - resource_template:
      https://portal.solaranalytics.com.au/api/v4/site_status/{{-
      states('input_text.sa_site_id')
      -}}?event_group=all
    headers:
      Authorization: >-
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 300
    sensor:
      - name: sa_status_log_entry
        unique_id: sa_status_log_entry
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set log_entry = value_json.data.event_list[0].fault_status|lower -%}
          {%- else -%}
            {%- set log_entry = "invalid" -%}
          {%- endif -%}
          {%- set status_map = {
            'resolved' : 'Good',
            'action_owner' : 'Check device',
            'moderate_under_production' : 'Under production',
            'zero_energy_production' : 'Zero production',
            'ongoing' : 'Ongoing problem',
            'unavailable' : 'API unavailable' }
            -%}
          {%- if log_entry in status_map -%}
            {{- status_map[log_entry] -}}
          {%- else -%}
            {{- log_entry -}}
          {%- endif -%}
        json_attributes_path: "$.data.event_list.[0]"
        json_attributes:
          - "fault_status"
          - "event_id"
          - "start_timestamp"
          - "end_timestamp"
          - "last_updated_at"
          - "severe_tag"
          - "event_type"
          - "fault_type"
          - "fault_class"
        availability: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {{- (value_json.data.event_list|list|length > 0) -}}
          {%- else -%}
            false
          {%- endif -%}

  #
  # Solar Analytics - get 5 minute energy data.
  # Used to calculate today's cumulative total energy for consumed, generated, imported and exported
  # energy as used by the HA Energy module.
  #
  # Updated on startup and every 5 minutes according to sa_data_by_5min_trigger.
  #
  - resource_template: https://portal.solaranalytics.com.au/api/v2/site_data/{{-
      states('input_text.sa_site_id')
      -}}?all=true&gran=minute&trunc=false&power=false&tstart={{-
      now().strftime("%Y%m%d")
      -}}&tend={{-
      now().strftime("%Y%m%d")
      -}}
    headers:
      Authorization: >-
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 0
    # REST SENSORS FOR sa_data_by_5min...
    sensor:

      # Timestamp of the latest energy data.
      # Return values: latest time_stamp if available, else previous time_stamp, default "none".
      #
      # Return values: latest time stamp else none if not available.
      #
      - name: sa_data_by_5min_time_stamp
        unique_id: sa_data_by_5min_time_stamp
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( time_stamp=none ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.time_stamp = sensor_data.t_stamp -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.time_stamp -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      # Sensor that indicates that the energy sensors have reset to a single record
      # Should only occur at midnight each day, but may also occur if there are no recordings early in the day.
      #
      # Return values: non-boolean "False" if not reset, "True" if reset. Is none if unavailable.
      #
      - name: sa_data_by_5min_meter_reset
        unique_id: sa_data_by_5min_meter_reset
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {{- "True" if ns.last_data <= 1 else "False" -}}
          {%- else -%}
            none
          {%- endif -%}
        json_attributes_path: "$.data[0]"
        json_attributes: "t_stamp"
        availability: >-
          {{- value_json is defined and value_json.data is defined -}}

      # The last 5 minutes energy by sensor type per Solar Analytics channel.
      # These sensors may be useful for calculating energy cost where energy costs vary at intervals down
      # to 5 minutes (e.g. Amber Electric). The may also be useful for configuring "Utility Meter" helpers in HA.
      #
      # Return values: numeric if available, else none if not available.
      #
      - name: sa_data_by_5min_energy_consumed
        unique_id: sa_data_by_5min_energy_consumed
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( consumed=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- if (sensor_data.energy_consumed|float(0.0)) > 0.0 -%}
                  {%- set ns.consumed = sensor_data.energy_consumed -%}
                {%- else -%}
                  {%- set ns.consumed = 0.0 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.consumed|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_energy_generated
        unique_id: sa_data_by_5min_energy_generated
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( generated=none ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_generated' in sensor_data and sensor_data.energy_generated is number) -%}
                {%- if (sensor_data.energy_generated|float(0.0)) > 0.0 -%}
                  {#- Only positive generation contributes -#}
                  {%- set ns.generated = sensor_data.energy_generated -%}
                {%- else -%}
                  {%- set ns.generated = 0.0 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.generated|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_generated','defined')|
                map(attribute='energy_generated')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_imported
        unique_id: sa_data_by_5min_imported
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( imported=0.0, consumed_home=0.0, generated=0.0, battery=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- if ('battery_storage' in sensor_data and sensor_data.battery_storage is number) -%}
                  {%- set ns.battery = sensor_data.battery_storage -%}
                {%- endif -%}
                {#- Only positive generation contributes -#}
                {%- if ('energy_generated' in sensor_data and sensor_data.energy_generated is number)
                      and (sensor_data.energy_generated|float(0.0) > 0.0) -%}
                  {%- set ns.generated = sensor_data.energy_generated -%}
                {%- endif -%}
                {%- set ns.consumed_home = sensor_data.energy_consumed|float(0.0) 
                      + ( ns.battery|float(0.0) * 2.0 )|float(0.0) -%}
                {%- if ns.consumed_home|float(0.0) + ns.battery|float(0.0) >= ns.generated|float(0.0) -%}
                  {%- set ns.imported = ns.consumed_home|float(0.0) + ns.battery|float(0.0) - ns.generated|float(0.0) -%}
                {%- else -%}
                  {%- set ns.imported = 0.0 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.imported|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_exported
        unique_id: sa_data_by_5min_exported
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( exported=0.0, consumed_home=0.0, generated=0.0, battery=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- if ('battery_storage' in sensor_data and sensor_data.battery_storage is number) -%}
                  {%- set ns.battery = sensor_data.battery_storage -%}
                {%- endif -%}
                {#- Only positive generation contributes -#}
                {%- if ('energy_generated' in sensor_data and sensor_data.energy_generated is number)
                      and (sensor_data.energy_generated|float(0.0) > 0.0) -%}
                  {%- set ns.generated = sensor_data.energy_generated -%}
                {%- endif -%}
                {%- set ns.consumed_home = sensor_data.energy_consumed|float(0.0) 
                      + ( ns.battery|float(0.0) * 2.0 )|float(0.0) -%}
                {%- if ns.generated|float(0.0) > ns.consumed_home|float(0.0) - ns.battery|float(0.0) -%}
                  {%- set ns.exported = ns.battery|float(0.0) + ns.generated|float(0.0) - ns.consumed_home|float(0.0) -%}
                {%- else -%}
                  {%- set ns.exported = 0.0 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.exported|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      # Daily cumulative total "raw" sensors per Solar Analytics channel reset at midnight.
      # These sensors are used for feeding "fully configured" template sensors defined further down below.
      #
      # Return values: numeric if available, else previous value else default 0.0.
      #
      - name: sa_data_by_5min_energy_consumed_total
        unique_id: sa_data_by_5min_energy_consumed_total
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( consumed=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) 
                    and (sensor_data.energy_consumed|float(0.0) > 0.0) 
                -%}
                {%- set ns.consumed = ns.consumed|float(0.0) + sensor_data.energy_consumed|float(0.0) -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.consumed|float(0.0)|round(4) -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_energy_consumed_total')|float(0.0) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_energy_generated_total
        unique_id: sa_data_by_5min_energy_generated_total
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( generated=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {#- Only positive generation contributes -#}
              {%- if ('energy_generated' in sensor_data and sensor_data.energy_generated is number) 
                    and (sensor_data.energy_generated|float(0.0) > 0.0) -%}
                {%- set ns.generated = ns.generated|float(0.0) + sensor_data.energy_generated|float(0.0) -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.generated|float(0.0)|round(4) -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_energy_generated_total')|float(0.0) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_generated','defined')|
                map(attribute='energy_generated')|select('is_number')|list|length ) > 0 -}}

      # Additional daily cumulative total "raw" sensors that reset at midnight.
      # These sensors are derived/calculated from the main Solar Analytics channels.
      #
      # Return values: numeric if available, else previous value else default 0.0.
      #
      - name: sa_data_by_5min_imported_total
        unique_id: sa_data_by_5min_imported_total
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( imported=0.0, consumed_home=0.0, generated=0.0, battery=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.battery = sensor_data.battery_storage|default(0.0)|float(0.0) -%}
                {%- set ns.consumed_home = sensor_data.energy_consumed|float(0.0) 
                      + 2.0 * ns.battery|float(0.0) -%}
                {#- Only positive generation contributes -#}
                {%- set ns.generated = sensor_data.energy_generated|float(0.0) 
                      if sensor_data.energy_generated|default(0.0)|float(0.0) > 0.0 else 0.0 -%}
                {%- if ns.consumed_home|float(0.0) - ns.battery|float(0.0)
                        >= ns.generated|float(0.0) -%}
                  {%- set ns.imported = ns.imported|float(0.0) 
                      + ns.consumed_home|float(0.0) - ns.battery|float(0.0) - ns.generated|float(0.0) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.imported|float(0.0)|round(4) -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_imported_total')|float(0.0) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_exported_total
        unique_id: sa_data_by_5min_exported_total
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( exported=0.0, consumed_home=0.0, generated=0.0, battery=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.battery = sensor_data.battery_storage|default(0.0)|float(0.0) -%}
                {%- set ns.consumed_home = sensor_data.energy_consumed|float(0.0) 
                      + 2.0 * ns.battery|float(0.0) -%}
                {#- Only positive generation contributes -#}
                {%- set ns.generated = sensor_data.energy_generated|float(0.0) 
                      if sensor_data.energy_generated|default(0.0)|float(0.0) > 0.0 else 0.0 -%}
                {%- if ns.battery|float(0.0) >= 0.0 -%}
                  {%- if ( ns.generated|float(0.0) > ns.consumed_home|float(0.0) ) 
                          or ( ns.consumed_home|float(0.0) < ns.battery|float(0.0) + ns.generated|float(0.0) ) -%}
                    {%- set ns.exported = ns.exported|float(0.0)
                          + ns.battery|float(0.0) + ns.generated|float(0.0) - ns.consumed_home|float(0.0) -%}
                  {%- endif -%}
                {%- else -%}
                  {%- if ns.generated|float(0.0) > ns.consumed_home|float(0.0) - ns.battery|float(0.0) -%}
                    {%- set ns.exported = ns.exported|float(0.0)
                          + ns.generated|float(0.0) - ( ns.consumed_home|float(0.0) - ns.battery|float(0.0) ) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.exported|float(0.0)|round(4) -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_exported_total')|float(0.0) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      # Additional "raw" sensor associated with the daily total of consumed energy that
      # has been generated from local sources (i.e. not imported).
      #
      # Return values: numeric if available, else previous value else default 0.0.
      #
      - name: sa_data_by_5min_consumed_solar_total
        unique_id: sa_data_by_5min_consumed_solar_total
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( solar_consumed=0.0, consumed_home=0.0, generated=0.0, battery=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.battery = sensor_data.battery_storage|default(0.0)|float(0.0) -%}
                {%- set ns.consumed_home = sensor_data.energy_consumed|float(0.0) 
                      + 2.0 * ns.battery|float(0.0) -%}
                {#- Only positive generation contributes -#}
                {%- set ns.generated = sensor_data.energy_generated|float(0.0) 
                      if sensor_data.energy_generated|default(0.0)|float(0.0) > 0.0 else 0.0 -%}
                {%- if ns.consumed_home|float(0.0) > 0.0 and ns.generated|float(0.0) > 0.0 -%}
                  {%- if ns.consumed_home|float(0.0)
                      > sensor_data.energy_generated|float(0.0) -%}
                    {%- set ns.solar_consumed = ns.solar_consumed|float
                          + sensor_data.energy_generated|float(0.0) -%}
                  {%- else -%}
                    {%- set ns.solar_consumed = ns.solar_consumed|float
                          + ns.consumed_home|float(0.0) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.solar_consumed|float(0.0)|round(4) -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_consumed_solar_total')|float(0.0) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_generated','defined')|
                map(attribute='energy_generated')|select('is_number')|list|length ) > 0 -}}

      #
      # Solar Analytics Energy history sensor for graphing each channel (e.g. in Apex Charts).
      # The units are in kW.
      #
      # Note: results are actually 5 minute average power, with area under the graph being the energy
      # usage within that time interval. The time duration is limited to 28x 5 minute intervals
      # (= 2h20m) as this fits within the 255 character max allowed by the state of a sensor.
      # Rounding to a reduced number of decimal places (e.g. 1 instead of 2) could increase
      # the number of intervals if that's desireable, but at a lower resolution.
      #
      # Return values: numeric array if available, else previous else empty array [].
      #
      - name: sa_data_by_5min_history_time_stamp
        unique_id: sa_data_by_5min_history_time_stamp
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0, sensor_values=[] ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for sensor_data in value_json.data -%}
              {%- if (loop.index > (ns.last_data - 28)) and (loop.index <= ns.last_data) -%}
                {%- set ns.sensor_values = ns.sensor_values 
                    + [ as_timestamp(sensor_data.t_stamp)|timestamp_custom('%H:%M') ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.sensor_values -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_history_time_stamp')|default([]) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_history_energy_consumed
        unique_id: sa_data_by_5min_history_energy_consumed
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0, sensor_values=[], current_value=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for sensor_data in value_json.data -%}
              {%- if (loop.index > (ns.last_data - 28)) and (loop.index <= ns.last_data) -%}
                {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                  {%- set ns.current_value = ((sensor_data.energy_consumed|float)*12.0/1000)|float(0.0)|round(2) -%}
                {%- else -%}
                  {#- data must be bad (none) - default to repeat last value -#}
                {%- endif -%}
                {%- set ns.sensor_values = ns.sensor_values + [ ns.current_value ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.sensor_values -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_history_energy_consumed')|default([]) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_history_energy_generated
        unique_id: sa_data_by_5min_history_energy_generated
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0, sensor_values=[], current_value=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for sensor_data in value_json.data -%}
              {%- if (loop.index > (ns.last_data - 28)) and (loop.index <= ns.last_data) -%}
                {%- if ('energy_generated' in sensor_data and sensor_data.energy_generated is number) -%}
                  {%- if sensor_data.energy_generated|float(0.0) > 0.0 -%}
                    {%- set ns.current_value = ((sensor_data.energy_generated|float)*12.0/1000)|float(0.0)|round(2) -%}
                  {%- else -%}
                    {#- Protect generated data from negative values (i.e. when the inverter is operating 
                        without solar input) -#}
                    {%- set ns.current_value = 0.0 -%}
                  {%- endif -%}
                {%- else -%}
                  {#- data must be bad (none) - default to repeat last value -#}
                {%- endif -%}
                {%- set ns.sensor_values = ns.sensor_values + [ ns.current_value ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.sensor_values -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_history_energy_generated')|default([]) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_generated','defined')|
                map(attribute='energy_generated')|select('is_number')|list|length ) > 0 -}}

      - name: sa_data_by_5min_history_imported_exported
        unique_id: sa_data_by_5min_history_imported_exported
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0, sensor_values=[], current_value=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for sensor_data in value_json.data -%}
              {%- if (loop.index > (ns.last_data - 28)) and (loop.index <= ns.last_data) -%}
                {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                  {%- set ns.current_value = ( ( sensor_data.energy_consumed|float(0.0) 
                            + sensor_data.battery_storage|default(0.0)|float(0.0)
                            - ( sensor_data.energy_generated
                                  if sensor_data.energy_generated|default(0.0)|float(0.0) > 0.0
                                    else 0.0
                                  )|float(0.0)
                            ) * 12.0 / 1000
                          )|float(0.0)|round(2) 
                    -%}
                {%- else -%}
                  {#- data must be bad (none) - default to repeat last value -#}
                {%- endif -%}
                {%- set ns.sensor_values = ns.sensor_values + [ ns.current_value ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.sensor_values -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_history_imported_exported')|default([]) -}}
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

      # A count of the number of time intervals since midnight. Used to calculate a long date/time
      # value for sa_todays_energy_history.
      #
      # Return values: numeric if available, else previous value else default 0.
      #
      - name: sa_data_by_5min_history_time_stamp_count
        unique_id: sa_data_by_5min_history_time_stamp_count
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( last_data=0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('energy_consumed' in sensor_data and sensor_data.energy_consumed is number) -%}
                {%- set ns.last_data = loop.index -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.last_data -}}
          {%- else -%}
            {{- states('sensor.sa_data_by_5min_history_time_stamp_count')|int(0) -}}
          {%- endif -%}
        json_attributes_path: "$.data[0]"
        json_attributes: "t_stamp"
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_consumed','defined')|
                map(attribute='energy_consumed')|select('is_number')|list|length ) > 0 -}}

  #
  # Solar Analytics - get live per minute power data.
  # Used to generate most recent power information.
  #
  # Note: this is not a published API 'get', but is used by the SA portal to display minute to
  # minute power for a site.
  #
  # Updated on startup and every 1 minute according to sa_live_site_data_trigger.
  #
  - resource_template:
      https://portal.solaranalytics.com.au/api/v3/live_site_data?site_id={{-
      states('input_text.sa_site_id')
      -}}&last_six=true
    headers:
      Authorization: >
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 0
    # REST SENSORS FOR sa_live_site_data...
    sensor:

      # Timestamp of the latest power data.
      # Return values: latest time stamp if available, else none.
      #
      - name: sa_live_site_data_time_stamp
        unique_id: sa_live_site_data_time_stamp
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( t_stamp=none ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('consumed' in sensor_data and sensor_data.consumed is number) -%}
                {%- set ns.t_stamp = as_timestamp(sensor_data.t_stamp)|timestamp_custom('%Y-%m-%d %H:%M:%S') -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.t_stamp -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('consumed','defined')|
                map(attribute='consumed')|select('is_number')|list|length ) > 0 -}}

      # Minutely updated "raw" power sensors as provided by Solar Analytics.
      #
      # Return values: numeric if available, else none.
      #
      - name: sa_live_site_data_consumed
        unique_id: sa_live_site_data_consumed
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( power=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('consumed' in sensor_data and sensor_data.consumed is number) -%}
                {%- set ns.power = sensor_data.consumed -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.power|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('consumed','defined')|
                map(attribute='consumed')|select('is_number')|list|length ) > 0 -}}

      - name: sa_live_site_data_generated
        unique_id: sa_live_site_data_generated
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( power=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('generated' in sensor_data and sensor_data.generated is number) -%}
                {#- Only positive generation contributes -#}
                {%- set ns.power = sensor_data.generated
                                    if sensor_data.generated|default(0.0)|float(0.0) > 0.0 
                                    else 0.0 -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.power|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('generated','defined')|
                map(attribute='generated')|select('is_number')|list|length ) > 0 -}}

      # Additional minutely updated "raw" sensor derived from Solar Analytics sourced data. A positive
      # value is power been drawn from the grid (imported) and a negative value is power being fed into
      # the grid (exported).
      #
      # Values for grid import are positive, values for export are negative.
      #
      # Return values: numeric if available, else none.
      #
      - name: sa_live_site_data_imported_exported
        unique_id: sa_live_site_data_imported_exported
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( power=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if ('consumed' in sensor_data and sensor_data.consumed is number) -%}
                {%- set consumed = sensor_data.consumed|float(0.0) -%}
                {#- Only positive generation contributes -#}
                {%- set generated = ( sensor_data.generated
                                      if sensor_data.generated|default(0.0)|float(0.0) > 0.0 
                                      else 0.0
                                    )|float(0.0) -%}
                {%- set battery = sensor_data.battery|default(0.0)|float(0.0) -%}
                {%- set ns.power = consumed + battery - generated -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.power|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('consumed','defined')|
                map(attribute='consumed')|select('is_number')|list|length ) > 0 -}}

  #
  # Solar Analytics - get hourly cumulative expected energy data for the day.
  # Used to report today's total expected generated energy to the most recent hour - a time lagging
  # report of expected, and not a forecast.
  # Notes: this is not a published API 'get', but is used by the SA portal.
  # The get also retrieves the daily total for the most recent hour for generated and consumed energy;
  # not required given 5 min updates of the same above. Checked every 30 minutes for changes in the last hour.
  #
  # Updated on startup and every 5 minutes according to sa_data_by_hour_trigger.
  #
  - resource_template: https://portal.solaranalytics.com.au/api/v2/site_data/{{-
      states('input_text.sa_site_id')
      -}}?all=false&gran=day&losses=true&power=false&trunc=false&tstart={{-
      now().strftime("%Y%m%d")
      -}}&tend={{-
      now().strftime("%Y%m%d")
      -}}
    headers:
      Authorization: >-
        {{- 'Bearer ' ~ state_attr('sensor.sa_auth_token_cached','token') -}}
    scan_interval: 0
    # REST SENSORS FOR sa_data_by_hour_... sensor (just one).
    sensor:

      # Return values: current time if data available, else none.
      #
      # Note: rest get timestamp is only the current date - rather use the current date-time of the get.
      #      {{- as_timestamp(value_json['data'][0].t_stamp)|timestamp_custom ('%Y-%m-%d %H:%M:%S') -}}
      - name: sa_data_by_hour_time_stamp
        unique_id: sa_data_by_hour_time_stamp
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {{- as_timestamp(now())|timestamp_custom ('%Y-%m-%d %H:%M:%S') -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_expected','defined')|
                map(attribute='energy_expected')|select('is_number')|list|length) > 0 -}}

      # Total Energy Generated Expected
      #
      # Return values: numeric if available and positive, else 0.0 if negative, else none.
      # Resets to zero on first update after midnight.
      #
      - name: sa_data_by_hour_generated_expected
        unique_id: sa_data_by_hour_generated_expected
        value_template: >-
          {%- if value_json is defined and value_json.data is defined -%}
            {%- set ns = namespace( expected=0.0 ) -%}
            {%- for sensor_data in value_json.data -%}
              {%- if sensor_data.energy_expected is number -%}
                {%- set ns.expected = sensor_data.energy_expected 
                    if sensor_data.energy_expected|float(0.0) > 0.0 -%}
              {%- endif -%}
            {%- endfor -%}
            {{- ns.expected|float(0.0)|round(4) -}}
          {%- else -%}
            none
          {%- endif -%}
        availability: >-
          {{- value_json is defined and value_json.data is defined
              and ( value_json.data|selectattr('energy_expected','defined')|
                map(attribute='energy_expected')|select('is_number')|list|length) > 0 -}}

template:

  #
  # Cached 5 minute Solar Analytics data timestamp and retry tracking
  #
  # Preserves the last valid 5 minute timestamp during temporary REST/API failures
  # or delayed Solar Analytics data publication.
  #
  # Uses timestamp_next_expected as a breadcrumb:
  # - valid raw timestamp sets timestamp_next_expected = raw + 5 minutes
  # - scheduled poll checks whether raw timestamp has reached timestamp_next_expected
  # - if not, update_failed becomes true and retry timer starts
  #
  # attributes:
  #   token - last valid Solar Analytics bearer token.
  #   expires - token expiry value from the most recent valid token refresh.
  #
  #   refresh_failed - true when the raw token refresh is unavailable or invalid.
  #   refresh_failed_reason - most recent token refresh failure cause:
  #     unavailable, invalid_token, unknown or none.
  #
  #   refresh_failed_last_timestamp - timestamp when the most recent token
  #     refresh failure was detected.
  #   refresh_failed_last_retry_count - retry count used in the most recent
  #     token refresh failure cycle.
  #   refresh_failed_restored_timestamp - timestamp when token refresh recovered.
  #   refresh_failed_duration_mins - duration of the most recent token refresh
  #     failure.
  #
  #   refresh_failed_count - token refresh failure event count.
  #
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.sa_auth_token
      - platform: state
        entity_id: timer.sa_token_retry_timer
        to: idle
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: sa_auth_token_cached
        unique_id: sa_auth_token_cached
        state: >-
          {%- set token = state_attr('sensor.sa_auth_token','token') -%}
          {%- if token is string and token|length > 20 -%}
            {{- states('sensor.sa_auth_token') -}}
          {%- else -%}
            {{- this.state if this.state is defined else 0 -}}
          {%- endif -%}
        attributes:
          token: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- if token is string and token|length > 20 -%}
              {{- token -}}
            {%- else -%}
              {{- this.attributes.token
                    if this.attributes is defined and this.attributes.token is defined
                    else '' -}}
            {%- endif -%}
          expires: >-
            {%- set expires = state_attr('sensor.sa_auth_token','expires') -%}
            {%- if expires is not none -%}
              {{- expires -}}
            {%- else -%}
              {{- this.attributes.expires
                    if this.attributes is defined and this.attributes.expires is defined
                    else '' -}}
            {%- endif -%}
          refresh_failed: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set initialized = this.state is defined
                  and this.state|int(0) > 0 -%}
            {%- if raw_valid -%}
              false
            {%- elif initialized and trig_entity == 'sensor.sa_auth_token' -%}
              true
            {%- elif initialized
                  and trig_entity == 'timer.sa_token_retry_timer' -%}
              true
            {%- else -%}
              {{- this.attributes.refresh_failed|default(false) -}}
            {%- endif -%}
          refresh_failed_reason: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- if raw_valid -%}
              valid_token
            {%- elif raw_state in ['unknown','unavailable','none',''] -%}
              raw_token_unavailable
            {%- elif trig_entity != '' -%}
              {{- trig_entity -}}
            {%- else -%}
              unknown
            {%- endif -%}
          refresh_failed_last_timestamp: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set initialized = this.state is defined
                  and this.state|int(0) > 0 -%}
            {%- set was_failed = this.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set old = this.attributes.refresh_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.refresh_failed_last_timestamp is defined
                  else '' -%}
            {%- if initialized and not raw_valid
                  and trig_entity == 'sensor.sa_auth_token' -%}
              {{- now().strftime('%Y-%m-%d %H:%M:%S') -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          refresh_failed_last_retry_count: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined and trigger.to_state is defined
                    and trigger.to_state is not none
                  else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set initialized = this.state is defined
                  and this.state|int(0) > 0 -%}
            {%- set was_failed = this.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set old =
                  this.attributes.refresh_failed_last_retry_count|int(0) -%}
            {#- New token refresh failure starts: reset retry count -#}
            {%- if initialized and not raw_valid
                  and trig_entity == 'sensor.sa_auth_token' -%}
              0
            {#- Count retry timer expiries while raw token remains invalid -#}
            {%- elif initialized and not raw_valid and was_failed
                  and trig_entity == 'timer.sa_token_retry_timer'
                  and trig_to == 'idle' -%}
              {{- old + 1 -}}
            {#- Hold last retry count after recovery -#}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          refresh_failed_restored_timestamp: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set was_failed = this.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set old = this.attributes.refresh_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.refresh_failed_restored_timestamp is defined
                  else '' -%}
            {#- Clear restored timestamp at start of a new failure -#}
            {%- if not raw_valid and trig_entity == 'sensor.sa_auth_token'
                  and not was_failed -%}
              {{- '' -}}
            {#- Record recovery when the raw token becomes valid again -#}
            {%- elif raw_valid
                  and was_failed
                  and trig_entity == 'sensor.sa_auth_token' -%}
              {{- now().strftime('%Y-%m-%d %H:%M:%S') -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          refresh_failed_duration_mins: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set failed_at = this.attributes.refresh_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.refresh_failed_last_timestamp is defined
                  else '' -%}
            {%- set restored_at = this.attributes.refresh_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.refresh_failed_restored_timestamp is defined
                  else '' -%}
            {%- set failed = this.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
            {%- if failed_at == '' -%}
              0
            {%- elif failed and not raw_valid -%}
              {{- ((as_timestamp(now()) 
                    - as_timestamp(failed_at)) / 60)|round(1) -}}
            {%- elif restored_at != '' -%}
              {{- ((as_timestamp(restored_at) 
                    - as_timestamp(failed_at)) / 60)|round(1) -}}
            {%- else -%}
              0
            {%- endif -%}
          refresh_failed_count: >-
            {%- set token = state_attr('sensor.sa_auth_token','token') -%}
            {%- set raw_state = states('sensor.sa_auth_token') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set raw_valid = token is string and token|length > 20
                  and raw_state not in ['unknown','unavailable','none',''] -%}
            {%- set initialized = this.state is defined
                  and this.state|int(0) > 0 -%}
            {%- set was_failed = this.attributes.refresh_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set old = this.attributes.refresh_failed_count|int(0) -%}
            {%- if initialized and not raw_valid
                  and trig_entity == 'sensor.sa_auth_token' -%}
              {{- old + 1 -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
        availability: >-
          true

  #
  # Cached 5 minute Solar Analytics data timestamp and retry tracking
  #
  # Preserves last valid 5 minute timestamp during temporary REST/API failures.
  # Allows derived sensors to hold stable values while retry attempts occur.
  # Works with sa_data_by_5min_trigger and sa_data_by_5min_trigger_retry.
  # Retries failed 5 minute data refreshes once per minute up to 3x.
  # New 3x retry cycle starts after each scheduled 5 minute poll attempt.
  #
  # attributes:
  #   update_failed - persistent refresh failure confirmed when true.
  #     True when:
  #     - raw timestamp remains unavailable after retry attempts, or
  #     - latest timestamp becomes stale (>= 6 minutes old).
  #   update_failed_reason - most recent failure cause:
  #     stale, unavailable or none (on start-up).
  #
  #   update_failed_cycle_retry_count - retry count for the active failure cycle.
  #
  #   update_failed_last_timestamp - timestamp associated with the most recent
  #     failed update.
  #   update_failed_last_retry_count - retry count used in the most recent
  #     failure cycle.
  #   update_failed_retry_recovered - true when the failed interval was
  #     recovered by retry; false when lost or superseded by a later timestamp.
  #   update_failed_restored_timestamp - first valid timestamp received after
  #     recovery.
  #
  #   update_failed_gap_count - missing 5-minute intervals in the last outage.
  #   update_failed_duration_mins - timestamp span between failure and recovery.
  #
  #   previous_timestamp - previous valid timestamp.
  #   last_timestamp_gap_mins - latest timestamp interval in minutes
  #     (normally 5 mins).
  #
  #   timestamp_gap_detected - latest timestamp continuity gap detected.
  #   timestamp_gap_count - timestamp gap event count.
  #   timestamp_gap_last_mins - size of the most recent timestamp gap.
  #   timestamp_gap_last_timestamp - timestamp associated with the most recent
  #     gap event.
  #   timestamp_gap_max_mins - largest timestamp gap observed.
  #
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp
      - platform: state
        entity_id: timer.sa_data_by_5min_retry_timer
        to: idle
      - platform: state
        entity_id: input_datetime.sa_data_by_5min_last_poll_attempt
    sensor:
      - name: sa_data_by_5min_time_stamp_cached
        unique_id: sa_data_by_5min_time_stamp_cached
        state: >-
          {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
          {%- if ts not in ['unknown','unavailable','none',''] -%}
            {{- ts -}}
          {%- else -%}
            {{- this.state if this.state is defined else 'none' -}}
          {%- endif -%}
        attributes:
          update_failed: >-
            {#- Stale timestamp detection.
                Solar Analytics 5-minute data is typically published several minutes
                after the timestamp itself, so comparing against "now()" requires a
                tolerance. A 6-minute threshold:
                  - ignores normal publication lag,
                  - detects the first missed 5-minute update,
                  - allows the retry timer to recover transient delays before they
                    become prolonged outages. -#}
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts))/60) >= 6 -%}
            {%- set was_failed = this.attributes.update_failed|default(false)
                  in [true,'true','True'] -%}
            {%- if stale -%}
              true
            {%- elif ts not in ['unknown','unavailable','none',''] -%}
              false
            {# Keep outage active if raw data is still unavailable #}
            {%- elif was_failed -%}
              true
            {%- elif trig_entity == 'timer.sa_data_by_5min_retry_timer' -%}
              true
            {%- elif trigger is not defined -%}
              {{ this.attributes.update_failed|default(false) }}
            {%- else -%}
              false
            {%- endif -%}
          update_failed_reason: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set old_value = this.attributes.update_failed_reason
                if this.attributes is defined
                  and this.attributes.update_failed_reason is defined
                else 'none' -%}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {%- if ts in ['unknown','unavailable','none'] -%}
              unavailable
            {%- elif stale -%}
              stale
            {%- elif this.attributes is defined
                  and this.attributes.update_failed|default(false) -%}
              {{- old_value -}}
            {%- else -%}
              {{- old_value -}}
            {%- endif -%}
          update_failed_cycle_retry_count: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set old_count = this.attributes.update_failed_cycle_retry_count|int(0)
                  if this.attributes is defined
                    and this.attributes.update_failed_cycle_retry_count is defined
                  else 0 -%}
            {%- set was_failed = this.attributes.update_failed|default(false)
                  in [true,'true','True'] -%}
            {#- Stale timestamp detection -#}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {%- set failed_now = ts in ['unknown','unavailable','none',''] or stale -%}
            {#- First failed scheduled poll in a new outage is cycle 1. -#}
            {%- if trig_entity == 'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and failed_now
                  and not was_failed -%}
              1
            {#- Subsequent failed scheduled polls during the same outage increment cycles. -#}
            {%- elif trig_entity == 'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and failed_now
                  and was_failed -%}
              {{- old_count + 1 -}}
            {#- Preserve the final cycle count after recovery or during normal operation. -#}
            {%- else -%}
              {{- old_count -}}
            {%- endif -%}
          update_failed_last_timestamp: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                if this.attributes is defined
                  and this.attributes.previous_timestamp is defined
                else '' -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                if trigger is defined
                  and trigger.to_state is defined
                  and trigger.to_state is not none
                else '' -%}
            {%- set failed = this.attributes.update_failed|default(false)
                in [true,'true','True'] -%}
            {%- set old_value = this.attributes.update_failed_last_timestamp
                if this.attributes is defined
                  and this.attributes.update_failed_last_timestamp is defined
                else '' -%}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {# New stale outage - latch once only #}
            {%- if not failed and trig_entity ==
                      'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and stale -%}
              {{- ts -}}
            {# New unavailable outage - latch once only #}
            {%- elif not failed
                    and trig_entity == 'timer.sa_data_by_5min_retry_timer'
                    and trig_to == 'idle'
                    and ts in ['unknown','unavailable','none',''] -%}
              {{- previous -}}
            {%- else -%}
              {{- old_value -}}
            {%- endif -%}
          update_failed_last_retry_count: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                if trigger is defined and trigger.to_state is defined
                  and trigger.to_state is not none
                else '' -%}
            {%- set old_count = this.attributes.update_failed_last_retry_count
                if this.attributes is defined
                  and this.attributes.update_failed_last_retry_count is defined
                else 0 -%}
            {#- Stale timestamp detection -#}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {#- A scheduled 5-minute poll attempt occurred while failure continues.
                Reset retry count for a new unavailable or stale cycle. -#}
            {%- if trig_entity == 'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and (ts in ['unknown','unavailable','none',''] or stale) -%}
              0
            {#- Count retry timer expiries while failure continues. -#}
            {%- elif trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle'
                  and (ts in ['unknown','unavailable','none',''] or stale) -%}
              {{- old_count|int(0) + 1 -}}
            {%- else -%}
              {{- old_count -}}
            {%- endif -%}
          update_failed_retry_recovered: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set failed_ts = this.attributes.update_failed_last_timestamp
                  if this.attributes is defined
                  and this.attributes.update_failed_last_timestamp is defined
                  else '' -%}
            {%- set old_value = this.attributes.update_failed_retry_recovered
                  if this.attributes is defined
                  and this.attributes.update_failed_retry_recovered is defined
                  else false -%}
            {%- set retry_count = this.attributes.update_failed_last_retry_count|int(0) -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined
                  and trigger.to_state is defined and trigger.to_state is not none
                  else '' -%}
            {#- Stale timestamp detection -#}
            {%- set stale =
                  ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {#- New stale failed cycle detected. Clear recovered status until outcome known. -#}
            {%- if trig_entity == 'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and stale -%}
              false
            {#- New unavailable failed cycle detected. Clear recovered status until outcome known. -#}
            {%- elif trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle'
                  and ts in ['unknown','unavailable','none',''] -%}
              false
            {#- Recovery detected.
                True only when recovery occurs after one or more retry attempts
                and the recovered timestamp has reached or exceeded the expected
                next 5-minute timestamp following the failed timestamp. -#}
            {%- elif trig_entity == 'sensor.sa_data_by_5min_time_stamp'
                  and ts not in ['unknown','unavailable','none','']
                  and failed_ts != ''
                  and retry_count > 0
                  and not stale -%}
              {%- set expected_ts = (as_timestamp(failed_ts) + 300)|round(0)|int -%}
              {%- set recovered_ts = as_timestamp(ts)|round(0)|int -%}
              {{- recovered_ts >= expected_ts -}}
            {%- else -%}
              {{- old_value -}}
            {%- endif -%}
          update_failed_restored_timestamp: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined and trigger.to_state is defined
                    and trigger.to_state is not none
                  else '' -%}
            {%- set failed_ts = this.attributes.update_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_last_timestamp is defined
                  else '' -%}
            {%- set restored_ts = this.attributes.update_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_restored_timestamp is defined
                  else '' -%}
            {#- Stale timestamp detection -#}
            {%- set stale = ts not in ['unknown','unavailable','none','']
                  and ((as_timestamp(now()) - as_timestamp(ts)) / 60) >= 6 -%}
            {#- New retry-confirmed failure: clear restored data timestamp -#}
            {#- New failed cycle: clear restored data timestamp. -#}
            {%- if trig_entity == 'input_datetime.sa_data_by_5min_last_poll_attempt'
                  and stale -%}
              {{- '' -}}
            {%- elif trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle'
                  and ts in ['unknown','unavailable','none',''] -%}
              {{- '' -}}
            {#- Recovery after retry-confirmed failure: record restored data timestamp once -#}
            {%- elif trig_entity == 'sensor.sa_data_by_5min_time_stamp'
                    and ts not in ['unknown','unavailable','none','']
                    and failed_ts != '' and restored_ts == '' -%}
              {{- ts -}}
            {#- Otherwise preserve previous restored data timestamp -#}
            {%- else -%}
              {{- restored_ts -}}
            {%- endif -%}
          update_failed_gap_count: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set failed_ts = this.attributes.update_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_last_timestamp is defined
                  else '' -%}
            {%- set restored_ts = this.attributes.update_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_restored_timestamp is defined
                  else '' -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined and trigger.to_state is defined
                    and trigger.to_state is not none
                  else '' -%}
            {#- Active retry-confirmed failure: reset current failed-gap count -#}
            {%- if trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle' and ts in ['unknown','unavailable','none',''] -%}
              0
            {#- Completed failure: derive missed intervals from frozen data timestamps -#}
            {%- elif failed_ts != '' and restored_ts != ''
                  and restored_ts != failed_ts
                  and as_timestamp(restored_ts) >= as_timestamp(failed_ts) -%}
              {%- set gap_mins = ((as_timestamp(restored_ts)
                      - as_timestamp(failed_ts)) / 60)|round(0)|int(0) -%}
              {{- [((gap_mins / 5)|int(0)) - 1, 0]|max -}}
            {%- else -%}
              0
            {%- endif -%}
          update_failed_duration_mins: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set failed_ts = this.attributes.update_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_last_timestamp is defined
                  else '' -%}
            {%- set restored_ts = this.attributes.update_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_restored_timestamp is defined
                  else '' -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined and trigger.to_state is defined
                    and trigger.to_state is not none
                  else '' -%}
            {#- Active retry-confirmed failure: reset current failed-gap duration -#}
            {%- if trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle' 
                  and ts in ['unknown','unavailable','none',''] -%}
              0
            {#- Completed failure: derive gap from frozen data timestamps -#}
            {%- elif failed_ts != '' and restored_ts != ''
                  and restored_ts != failed_ts
                  and as_timestamp(restored_ts) >= as_timestamp(failed_ts) -%}
              {{- ((as_timestamp(restored_ts)
                    - as_timestamp(failed_ts)) / 60)|round(0)|int(0) -}}
            {%- else -%}
              0
            {%- endif -%}
          previous_timestamp: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- if ts not in ['unknown','unavailable','none',''] -%}
              {{- ts -}}
            {%- else -%}
              {{- this.attributes.previous_timestamp
                    if this.attributes is defined
                      and this.attributes.previous_timestamp is defined
                    else '' -}}
            {%- endif -%}
          last_timestamp_gap_mins: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                if this.attributes is defined
                  and this.attributes.previous_timestamp is defined
                else '' -%}
            {%- set old_gap = this.attributes.last_timestamp_gap_mins
                if this.attributes is defined
                  and this.attributes.last_timestamp_gap_mins is defined
                else 5 -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {{- ((as_timestamp(current)
                    - as_timestamp(previous)) / 60)|round(0)|int(0) -}}
            {%- else -%}
              {{- old_gap -}}
            {%- endif -%}
          timestamp_gap_detected: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                  if this.attributes is defined
                    and this.attributes.previous_timestamp is defined
                  else '' -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {%- set gap = ((as_timestamp(current) 
                      - as_timestamp(previous)) / 60)|round(0)|int(0) -%}
              {{- gap > 5 -}}
            {%- else -%}
              false
            {%- endif -%}
          timestamp_gap_count: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                  if this.attributes is defined
                    and this.attributes.previous_timestamp is defined
                  else '' -%}
            {%- set old_count = this.attributes.timestamp_gap_count
                  if this.attributes is defined
                    and this.attributes.timestamp_gap_count is defined
                  else 0 -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {%- set gap = ((as_timestamp(current) 
                      - as_timestamp(previous)) / 60)|round(0)|int(0) -%}
              {{- old_count|int(0) + 1 if gap > 5 else old_count|int(0) -}}
            {%- else -%}
              {{- old_count|int(0) -}}
            {%- endif -%}
          timestamp_gap_last_mins: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                  if this.attributes is defined
                    and this.attributes.previous_timestamp is defined
                  else '' -%}
            {%- set old_last = this.attributes.timestamp_gap_last_mins
                  if this.attributes is defined
                    and this.attributes.timestamp_gap_last_mins is defined
                  else 0 -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {%- set gap = ((as_timestamp(current) 
                      - as_timestamp(previous)) / 60)|round(0)|int(0) -%}
              {{- gap if gap > 5 else old_last|int(0) -}}
            {%- else -%}
              {{- old_last|int(0) -}}
            {%- endif -%}
          timestamp_gap_last_timestamp: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                  if this.attributes is defined
                    and this.attributes.previous_timestamp is defined
                  else '' -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {%- set gap = ((as_timestamp(current) - as_timestamp(previous)) / 60)
                    |round(0)|int(0) -%}
              {{- now().strftime('%Y-%m-%d %H:%M:%S') if gap > 5
                    else this.attributes.timestamp_gap_last_timestamp|default('') -}}
            {%- else -%}
              {{- this.attributes.timestamp_gap_last_timestamp|default('') -}}
            {%- endif -%}
          timestamp_gap_max_mins: >-
            {%- set current = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set previous = this.attributes.previous_timestamp
                  if this.attributes is defined
                    and this.attributes.previous_timestamp is defined
                  else '' -%}
            {%- set old_max = this.attributes.timestamp_gap_max_mins
                  if this.attributes is defined
                    and this.attributes.timestamp_gap_max_mins is defined
                  else 0 -%}
            {%- if current not in ['unknown','unavailable','none','']
                  and previous != '' and current != previous -%}
              {%- set gap = ((as_timestamp(current) 
                      - as_timestamp(previous)) / 60)|round(0)|int(0) -%}
              {{- [gap, old_max|int(0)]|max -}}
            {%- else -%}
              {{- old_max|int(0) -}}
            {%- endif -%}
          update_failed_count: >-
            {%- set ts = states('sensor.sa_data_by_5min_time_stamp') -%}
            {%- set trig_entity = trigger.entity_id if trigger is defined else '' -%}
            {%- set trig_to = trigger.to_state.state
                  if trigger is defined and trigger.to_state is defined
                    and trigger.to_state is not none
                  else '' -%}
            {%- set old_count = this.attributes.update_failed_count|int(0) -%}
            {%- set restored_ts = this.attributes.update_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_restored_timestamp is defined
                  else '' -%}
            {%- if trig_entity == 'timer.sa_data_by_5min_retry_timer'
                  and trig_to == 'idle' and ts in ['unknown','unavailable','none','']
                  and restored_ts != '' -%}
              {{- old_count + 1 -}}
            {%- else -%}
              {{- old_count -}}
            {%- endif -%}
        availability: >-
          true

  #
  # Expected live Solar Analytics timestamp and outage tracking
  #
  # Normally follows the raw live timestamp.
  #
  # After each scheduled live poll, if the raw timestamp remains unavailable or appears
  # stale (repeat of previous), advances the previous expected timestamp by 1 minute.
  #
  # Intended to mask known top-of-hour live data publication gaps (a known SA API issue), 
  # stale timestamp responses and short outages.
  #
  # attributes:
  #   update_failed - true when the raw live timestamp is unavailable or has
  #     failed to advance beyond the expected timestamp after a scheduled poll.
  #   update_failed_reason - most recent failure cause:
  #     stale, unavailable or none (on start-up).
  #
  #   update_failed_last_timestamp - timestamp in use when the most recent
  #     failure condition was first detected.
  #   update_failed_restored_timestamp - first valid raw live timestamp
  #     received after recovery.
  #   update_failed_count - count of update_failed events detected.
  #
  #   timestamp_next_expected - next expected live timestamp breadcrumb.
  #     Set to raw timestamp + 60 seconds after valid raw updates, or
  #     advanced by 60 seconds after each synthetic timestamp.
  #
  #   timestamp_stale - true when the raw live timestamp is valid but has
  #     failed to advance to the expected timestamp after a scheduled poll.
  #   timestamp_stale_last - most recent raw timestamp identified as stale.
  #
  #   synthetic_timestamp_count - count of synthetic timestamps generated to
  #     maintain timestamp continuity during unavailable or stale conditions.
  #
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.sa_live_site_data_time_stamp
      - platform: event
        event_type: sa_live_site_data_poll_completed
    sensor:
      - name: sa_live_site_data_time_stamp_expected
        unique_id: sa_live_site_data_time_stamp_expected
        state: >-
          {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
          {%- set next_expected = this.attributes.timestamp_next_expected
                if this.attributes is defined
                  and this.attributes.timestamp_next_expected is defined
                else '' -%}
          {%- set poll_completed = trigger is defined
                and trigger.platform == 'event' -%}
          {%- set raw_last_changed =
                states.sensor.sa_live_site_data_time_stamp.last_changed
                if states.sensor.sa_live_site_data_time_stamp is defined
                else none -%}
          {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                if raw_last_changed is not none
                else 9999 -%}
          {%- set raw_recent = raw_age <= 30 -%}
          {%- set raw_valid =
                ts not in ['unknown','unavailable','none',''] -%}
          {%- set next_valid =
                next_expected not in ['unknown','unavailable','none',''] -%}
          {%- set raw_behind_next = raw_valid and next_valid
                and as_timestamp(ts) < as_timestamp(next_expected) -%}
          {%- set should_synth = poll_completed and next_valid
                and (not raw_valid
                  or (raw_behind_next and not raw_recent)) -%}
          {#- Raw timestamp state change. Real data is authoritative. -#}
          {%- if raw_valid and not poll_completed -%}
            {{- ts -}}
          {#- Poll completed but raw timestamp is unavailable or stale/not advancing. 
              Follow breadcrumb. -#}
          {%- elif should_synth -%}
            {{- next_expected -}}
          {#- Poll completed and raw is valid/recent. Do not predict the next 
              minute. -#}
          {%- elif poll_completed and raw_valid -%}
            {{- this.state if this.state is defined else ts -}}
          {#- Fallback. -#}
          {%- else -%}
            {{- this.state if this.state is defined else 'none' -}}
          {%- endif -%}
        attributes:
          update_failed: >-
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set raw_last_changed =
                  states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid = 
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {{- not raw_valid 
                or (raw_valid and next_valid and not raw_recent
                  and as_timestamp(ts) < as_timestamp(next_expected)) -}}
          update_failed_reason: >-
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set old_value = this.attributes.update_failed_reason
                if this.attributes is defined
                  and this.attributes.update_failed_reason is defined
                else 'none' -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                if this.attributes is defined
                  and this.attributes.timestamp_next_expected is defined
                else '' -%}
            {%- set raw_last_changed =
                  states.sensor.sa_live_site_data_time_stamp.last_changed
                if states.sensor.sa_live_site_data_time_stamp is defined
                else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                if raw_last_changed is not none
                else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                next_expected not in ['unknown','unavailable','none',''] -%}
            {%- if not raw_valid -%}
              unavailable
            {%- elif next_valid and not raw_recent
                  and as_timestamp(ts) < as_timestamp(next_expected) -%}
              stale
            {%- else -%}
              {{- old_value -}}
            {%- endif -%}
          update_failed_last_timestamp: >-
            {%- set old = this.attributes.update_failed_last_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_last_timestamp is defined
                  else '' -%}
            {%- set failed = this.attributes.update_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set raw_last_changed = 
                  states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {%- set failed_now = not raw_valid
                  or (raw_valid and next_valid and not raw_recent 
                    and as_timestamp(ts) < as_timestamp(next_expected)) -%}
            {%- if failed_now and not failed -%}
              {{- this.state if this.state is defined else '' -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          update_failed_restored_timestamp: >-
            {%- set old = this.attributes.update_failed_restored_timestamp
                  if this.attributes is defined
                    and this.attributes.update_failed_restored_timestamp is defined
                  else '' -%}
            {%- set failed = this.attributes.update_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- if raw_valid and failed -%}
              {{- ts -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          update_failed_count: >-
            {%- set old = this.attributes.update_failed_count|int(0) -%}
            {%- set failed = this.attributes.update_failed|default(false)
                  in [true,'true','True'] -%}
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set raw_last_changed =
                  states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {%- set failed_now = not raw_valid
                  or (raw_valid and next_valid and not raw_recent
                    and as_timestamp(ts) < as_timestamp(next_expected)) -%}
            {{- old + 1 if failed_now and not failed else old -}}
          timestamp_next_expected: >-
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set old_next = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set poll_completed = trigger is defined
                  and trigger.platform == 'event' -%}
            {%- set raw_last_changed =
                  states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  old_next not in ['unknown','unavailable','none',''] -%}
            {%- set raw_behind_next = raw_valid and next_valid
                  and as_timestamp(ts) < as_timestamp(old_next) -%}
            {%- set should_synth = poll_completed and next_valid
                  and (not raw_valid
                    or (raw_behind_next and not raw_recent)) -%}
            {#- Valid raw timestamp changed. Breadcrumb becomes raw + 60s. -#}
            {%- if raw_valid and not poll_completed -%}
              {{- (as_timestamp(ts) + 60)|timestamp_custom('%Y-%m-%d %H:%M:%S') -}}
            {#- Synthetic timestamp used. Breadcrumb advances by another minute. -#}
            {%- elif should_synth -%}
              {{- (as_timestamp(old_next) + 60)|timestamp_custom('%Y-%m-%d %H:%M:%S') -}}
            {#- Raw is valid and recent; keep breadcrumb. -#}
            {%- elif raw_valid and next_valid -%}
              {{- old_next -}}
            {#- Initial fallback. -#}
            {%- elif raw_valid -%}
              {{- (as_timestamp(ts) + 60)|timestamp_custom('%Y-%m-%d %H:%M:%S') -}}
            {%- else -%}
              {{- old_next -}}
            {%- endif -%}
          timestamp_stale: >-
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set poll_completed = trigger is defined
                  and trigger.platform == 'event' -%}
            {%- set raw_last_changed =
                    states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age =
                    (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {%- if not poll_completed -%}
              {{- this.attributes.timestamp_stale
                if this.attributes is defined
                  and this.attributes.timestamp_stale is defined
                else false -}}
            {%- elif not raw_valid -%}
              true
            {%- elif next_valid and not raw_recent
                    and as_timestamp(ts) < as_timestamp(next_expected) -%}
              true
            {%- else -%}
              false
            {%- endif -%}
          timestamp_stale_last: >-
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set old = this.attributes.timestamp_stale_last
                  if this.attributes is defined
                    and this.attributes.timestamp_stale_last is defined
                  else '' -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set poll_completed = trigger is defined
                  and trigger.platform == 'event' -%}
            {%- set raw_last_changed =
                    states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age = (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {%- if poll_completed and raw_valid and next_valid and not raw_recent
                  and as_timestamp(ts) < as_timestamp(next_expected) -%}
              {{- ts -}}
            {%- elif poll_completed and not raw_valid and this.state is defined -%}
              {{- this.state -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          synthetic_timestamp_count: >-
            {%- set old = this.attributes.synthetic_timestamp_count|int(0) -%}
            {%- set ts = states('sensor.sa_live_site_data_time_stamp') -%}
            {%- set next_expected = this.attributes.timestamp_next_expected
                  if this.attributes is defined
                    and this.attributes.timestamp_next_expected is defined
                  else '' -%}
            {%- set poll_completed = trigger is defined
                  and trigger.platform == 'event' -%}
            {%- set raw_last_changed =
                    states.sensor.sa_live_site_data_time_stamp.last_changed
                  if states.sensor.sa_live_site_data_time_stamp is defined
                  else none -%}
            {%- set raw_age =
                    (as_timestamp(now()) - as_timestamp(raw_last_changed))
                  if raw_last_changed is not none
                  else 9999 -%}
            {%- set raw_recent = raw_age <= 30 -%}
            {%- set raw_valid =
                  ts not in ['unknown','unavailable','none',''] -%}
            {%- set next_valid =
                  next_expected not in ['unknown','unavailable','none',''] -%}
            {%- set raw_behind_next = raw_valid and next_valid
                  and as_timestamp(ts) < as_timestamp(next_expected) -%}
            {%- set should_synth = poll_completed and next_valid
                  and (not raw_valid
                    or (raw_behind_next and not raw_recent)) -%}
            {{- old + 1 if should_synth else old -}}
        availability: >-
          true

  - trigger:
      - platform: state
        entity_id: sensor.sa_data_by_5min_time_stamp_cached
        not_to:
          - "unknown"
          - "unavailable"
        for: "00:00:02"
    sensor:
      # Solar Analytics todays total energy sensors
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Total Energy Consumed"
        default_entity_id: sensor.sa_todays_energy_consumed_total
        unique_id: sa_todays_energy_consumed_total
        unit_of_measurement: "Wh"
        icon: "mdi:home-lightning-bolt-outline"
        device_class: "energy"
        state_class: "total_increasing"
        state: >-
          {%- set new = states('sensor.sa_data_by_5min_energy_consumed_total')|float(none) -%}
          {%- set old = this.state|float(0.0) -%}
          {%- set RESET_THRESHOLD = 5.0 -%}
          {%- if new is number -%}
            {%- set new_val = new|float(0.0) -%}
            {#- SMALL NEGATIVE DRIFT (rounding, calc noise) -#}
            {%- if new_val < old and (old - new_val) < 0.01 -%}
              {{- old -}}
            {#- TRUE RESET (large drop) -#}
            {%- elif new_val < old and (old - new_val) > RESET_THRESHOLD -%}
              {{- new_val -}}
            {#- NORMAL INCREASE -#}
            {%- elif new_val > old -%}
              {{- new_val -}}
            {#- HOLD VALUE -#}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"
          last5min: "{{- states('sensor.sa_data_by_5min_energy_consumed') -}}"

      - name: "Total Energy Generated"
        default_entity_id: sensor.sa_todays_energy_generated_total
        unique_id: sa_todays_energy_generated_total
