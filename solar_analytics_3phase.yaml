          last5min: "{{- states('sensor.sa_data_by_5min_exported') -}}"

      #
      # Solar Energy Consumed as kWh, % of generated, and % of of consumed.
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Total Energy Consumed Solar"
        default_entity_id: sensor.sa_todays_energy_consumed_solar
        unique_id: sa_todays_energy_consumed_solar
        unit_of_measurement: "Wh"
        icon: mdi:solar-power
        device_class: "energy"
        state_class: "total_increasing"
        state: >-
          {%- set new = states('sensor.sa_data_by_5min_consumed_solar_total')|float(none) -%}
          {%- set old = this.state|float(0.0) -%}
          {%- set RESET_THRESHOLD = 5.0 -%}
          {%- if new is number -%}
            {%- set new_val = new|float(0.0) -%}
            {%- if new_val < old and (old - new_val) < 0.01 -%}
              {{- old -}}
            {%- elif new_val < old and (old - new_val) > RESET_THRESHOLD -%}
              {{- new_val -}}
            {%- elif new_val > old -%}
              {{- new_val -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"

      #
      # Calculation logic considerate of total energy generated at start of the day
      # could be negative (i.e. the inverter has consumed energy at start-up).
      #
      # Percentage of generated energy that has been consumed.
      # Only shows valid sensor when the daily generated solar energy is greater than 100Wh.
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Percentage Generated Energy Consumed"
        default_entity_id: sensor.sa_todays_generated_consumed_percentage
        unique_id: sa_todays_generated_consumed_percentage
        unit_of_measurement: "%"
        icon: mdi:solar-power
        state: >-
          {%- set consumed_solar = states('sensor.sa_data_by_5min_consumed_solar_total')|float(0.0) -%}
          {%- set generated_total = states('sensor.sa_data_by_5min_energy_generated_total')|float(0.0) -%}
          {%- set old = this.state|float(0.0) -%}
          {%- if generated_total > 0 -%}
            {%- if (consumed_solar < generated_total) and (consumed_solar > 100.0) -%}
              {%- set new_val = (consumed_solar / generated_total * 100.0)|round(1) -%}
              {{- new_val if new_val != old else this.state -}}
            {%- else -%}
              {{- 100.0 if 100.0 != old else this.state -}}
            {%- endif -%}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"

      # Percentage of consumed energy that has been generated.
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Percentage Consumed Energy Generated"
        default_entity_id: sensor.sa_todays_consumed_generated_percentage
        unique_id: sa_todays_consumed_generated_percentage
        unit_of_measurement: "%"
        icon: mdi:solar-power
        state: >-
          {%- set consumed_solar = states('sensor.sa_data_by_5min_consumed_solar_total')|float(0.0) -%}
          {%- set consumed_total = states('sensor.sa_data_by_5min_energy_consumed_total')|float(0.0) -%}
          {%- set old = this.state|float(0.0) -%}
          {%- if consumed_total > 0 -%}
            {%- if (consumed_solar < consumed_total) and (consumed_solar > 100.0) -%}
              {%- set new_val = (consumed_solar / consumed_total * 100.0)|round(1) -%}
              {{- new_val if new_val != old else this.state -}}
            {%- else -%}
              {{- this.state -}}
            {%- endif -%}
          {%- else -%}
            0.0
          {%- endif -%}
        attributes:
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"

      #
      # Solar Analytics Energy history sensor for graphing each channel (e.g. in Apex Charts).
      # The units are in kW.
      #
      # Note: results are 5 minute average power, with area under the graph being the energy
      # usage within that time interval. The time duration is limited to 28x 5 minute intervals
      # (= 2h20m) as this fits within the 255 character max allowed by the state of a sensor.
      # Rounding to a reduced number of decimal places (e.g. 1 instead of 2) could increase
      # the number of intervals if that's desireable, but at a lower resolution. Lastly,
      # the history sensors as states from above are implemented as attributes so they
      # can be readily interpreted as lists.
      #
      - name: "Total Energy History"
        default_entity_id: sensor.sa_todays_energy_history
        unique_id: sa_todays_energy_history
        state: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"
        icon: mdi:sun-clock
        attributes:
          times: >-
            {%- set ns = namespace( times=[],
                count = states('sensor.sa_data_by_5min_history_time_stamp_count')|int(0) ) -%}
            {%- for i in range(ns.count) -%}
              {%- if i > ns.count - 29 -%}
                {%- set ns.times = ns.times + [
                    as_local( 
                      as_datetime( states('sensor.sa_data_by_5min_time_stamp') )  
                      - timedelta(minutes=(ns.count*5)-((i+1)*5)) 
                      ).strftime("%Y-%m-%d %H:%M:%S") ] -%}
                {%- endif -%}
            {%- endfor -%}
            {{- ns.times -}}
          times_simple: >
            {{- states('sensor.sa_data_by_5min_history_time_stamp') -}}
          energy_consumed: >
            {{- states('sensor.sa_data_by_5min_history_energy_consumed') -}}
          energy_generated: >
            {{- states('sensor.sa_data_by_5min_history_energy_generated') -}}
          energy_imported_exported: >
            {{- states('sensor.sa_data_by_5min_history_imported_exported') -}}
  - trigger:
    - platform: state
      entity_id:
        - sensor.sa_data_by_hour_time_stamp
        - sensor.sa_data_by_hour_generated_expected

    sensor:
      # Expected solar generation to current hour - updated hourly
      #
      # Importantly, the sensor is stabilised by clamping near-zero noise variations
      # that may occur during nighttime hours. Both the previous (old) value and the
      # new upstream value are normalised to zero in this region to eliminate micro-
      # step changes that cause template loop warnings.
      #
      # The sensor preserves valid state and only reacts to meaningful monotonic
      # changes — eliminating template loops and improving real-world accuracy.
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Total Energy Generated Expected"
        default_entity_id: sensor.sa_todays_energy_generated_expected_total
        unique_id: sa_todays_energy_generated_expected_total
        unit_of_measurement: "kWh"
        icon: mdi:solar-power
        device_class: "energy"
        state_class: "total"
        state: >-
          {%- set new = states('sensor.sa_data_by_hour_generated_expected')|float(none) -%}
          {%- set old = this.state|float(0.0) -%}
          {%- if now().hour == 0 -%}
            0.0
          {%- elif new is number -%}
            {{- new|float(0.0) / 1000 -}}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: >-
            {%- set ts = states('sensor.sa_data_by_hour_time_stamp') -%}
            {%- if ts not in ['unknown','unavailable','none',''] -%}
              {{- ts -}}
            {%- else -%}
              {{- states.sensor.sa_data_by_hour_time_stamp.last_changed
                  .strftime('%Y-%m-%d %H:%M:%S') -}}
            {%- endif -%}
          update_failed: >-
            {%- set new = states('sensor.sa_data_by_hour_generated_expected')|float(none) -%}
            {%- if new is not number -%}
              true
            {%- else -%}
              false
            {%- endif -%}
          timestamp_failed: >-
            {%- set ts = states('sensor.sa_data_by_hour_time_stamp') -%}
            {%- if ts in ['unknown','unavailable','none',''] -%}
              true
            {%- else -%}
              false
            {%- endif -%}
        availability: >-
          true

  - trigger:
      - platform: state
        entity_id: sensor.sa_live_site_data_time_stamp_expected
        not_to:
          - "unknown"
          - "unavailable"
          - "none"
        for: "00:00:02"

    sensor:
      #
      # Solar Analytics power sensors
      #
      # Return values: numeric if available, else previous value else 0.0.
      #
      - name: "Power Consumption"
        default_entity_id: sensor.sa_consumption_power
        unique_id: sa_consumption_power
        unit_of_measurement: "W"
        icon: mdi:home-lightning-bolt-outline
        device_class: "power"
        state_class: "measurement"
        state: >-
          {%- set new = states('sensor.sa_live_site_data_consumed')|float(none) -%}
          {%- set old = this.state|float(none) -%}
          {%- if new is number and old is number -%}
            {%- set new_val = new|float(0.0) -%}
            {{- new_val if (new_val - old)|abs > 0.0001 else this.state|float(0.0) -}}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: >-
            {{- states('sensor.sa_live_site_data_time_stamp_expected') -}}
          update_failed: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed') -}}
          update_failed_last_timestamp: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed_last_timestamp') -}}

      - name: "Power Generation"
        default_entity_id: sensor.sa_generation_power
        unique_id: sa_generation_power
        unit_of_measurement: "W"
        icon: mdi:solar-power
        device_class: "power"
        state_class: "measurement"
        state: >-
          {%- set new = states('sensor.sa_live_site_data_generated')|float(none) -%}
          {%- set old = this.state|float(none) -%}
          {%- if new is number and old is number -%}
            {%- set new_val = new|float(0.0) -%}
            {{- new_val if (new_val - old)|abs > 0.0001 else this.state|float(0.0) -}}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: >-
            {{- states('sensor.sa_live_site_data_time_stamp_expected') -}}
          update_failed: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed') -}}
          update_failed_last_timestamp: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed_last_timestamp') -}}

      - name: "Power Import Export"
        default_entity_id: sensor.sa_import_export_power
        unique_id: sa_import_export_power
        unit_of_measurement: "W"
        icon: mdi:transmission-tower
        device_class: "power"
        state_class: "measurement"
        state: >-
          {%- set new = states('sensor.sa_live_site_data_imported_exported')|float(none) -%}
          {%- set old = this.state|float(none) -%}
          {%- if new is number and old is number -%}
            {%- set new_val = new|float(0.0) -%}
            {{- new_val if (new_val - old)|abs > 0.0001 else this.state|float(0.0) -}}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: >-
            {{- states('sensor.sa_live_site_data_time_stamp_expected') -}}
          update_failed: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed') -}}
          update_failed_last_timestamp: >-
            {{- state_attr('sensor.sa_live_site_data_time_stamp_expected',
                  'update_failed_last_timestamp') -}}

  - sensor:
      # Solar Analytics status sensors
      #
      # 24-Jul-26 - added time_stamp.
      #
      - name: "Dashboard Status"
        default_entity_id: sensor.sa_dashboard_status
        unique_id: sa_dashboard_status
        state: "{{- state_attr('sensor.sa_status', 'dashboard_status') -}}"
        attributes:
          time_stamp: "{{- states('sensor.sa_status') -}}"

      - name: "System Status"
        default_entity_id: sensor.sa_mer_status
        unique_id: sa_mer_status
        state: "{{- state_attr('sensor.sa_status', 'mer_status') -}}"
        attributes:
          time_stamp: "{{- states('sensor.sa_status') -}}"

      - name: "PV Performance"
        default_entity_id: sensor.sa_mer_percentage
        unique_id: sa_mer_percentage
        state: "{{- state_attr('sensor.sa_status', 'mer_percentage') -}}"
        unit_of_measurement: "%"
        attributes:
          time_stamp: "{{- states('sensor.sa_status') -}}"

      #
      # Home Assistant Energy Dashboard extras
      #
      #
      # Todays Energy Total Net Cost
      #
      # The HA Energy Dashboard automatically creates two entities respectively derived from the sa_todays_energy_imported
      # and sa_todays_energy_exported, where:
      #   > sa_todays_energy_imported_cost - cost of imported energy
      #   > sa_todays_energy_exported_compensation - revenue from exported energy
      # This new entity provides the net cost (imported cost minus exported revenue)
      #
      - name: "Todays Energy Total Net Cost"
        default_entity_id: sensor.sa_todays_energy_total_net_cost
        unique_id: sa_todays_energy_total_net_cost
        unit_of_measurement: "AUD"
        device_class: "monetary"
        icon: mdi:cash
        state_class: "total"
        state: >-
          {%- set import_raw = states('sensor.sa_todays_energy_imported_cost')|float(none) -%}
          {%- set export_raw = states('sensor.sa_todays_energy_exported_compensation')|float(none) -%}
          {%- set old = this.state|float(none) -%}
          {%- if import_raw is number and export_raw is number -%}
            {%- set new_val = import_raw|float(0.0) - export_raw|float(0.0) -%}
            {{- new_val if new_val != old|float(0.0) else this.state|float(0.0) -}}
          {%- else -%}
            {{- old -}}
          {%- endif -%}
        attributes:
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"

  #
  # Todays Energy Import Rate
  #
  # Useful for those on a variable electricity import/general rate configured in the HA Energy Dashboard
  # (e.g. peak/off-peak/shoulder, Amber Energy wholesale spot market pricing). The average import
  # rate $/kWh = cumulative exported energy kWh divided by the cumulative imported energy revenue $.
  # Resets to zero at midnight. The sensor sa_todays_energy_imported_cost is created by the
  # HA Energy Dashboard when appropriate pricing is set-up for energy drawn from the grid.
  #
  # Defaults to previous value when the imported total Wh is < 100.
  #
  - trigger:
      - platform: state
        entity_id: sensor.sa_todays_energy_imported_cost
    sensor:
      - name: "Todays Energy Import Rate"
        unique_id: sa_todays_energy_import_rate
        unit_of_measurement: "$/kWh"
        device_class: "monetary"
        icon: mdi:cash-plus
        state: >-
          {%- set imported = states('sensor.sa_data_by_5min_imported_total')|float(0.0) -%}
          {%- set cost = states('sensor.sa_todays_energy_imported_cost')|float(0.0) -%}
          {%- set old = this.state|float(none) -%}
          {%- if imported > 0 -%}
            {%- if imported > 100 -%}
              {{- (cost / imported * 1000.0)|float(0.0)|round(3) -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          {%- else -%}
            0.0
          {%- endif -%}
        attributes:
          state_class: "measurement"
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"
        availability: >-
          {{- states('sensor.sa_data_by_5min_imported_total')|float(0.0) > 0 -}}

  #
  # Todays Energy Export Rate
  #
  # Useful for those on a variable electricity feed-in (FIT) rate configured in the HA Energy Dashboard
  # (e.g. peak/off-peak/shoulder, Amber Energy wholesale spot market pricing). The average export
  # rate $/kWh = cumulative exported energy kWh divided by the cumulative exported energy revenue $.
  # Resets to zero at midnight. The sensor sa_todays_energy_exported_compensation is created by the
  # HA Energy Dashboard when appropriate pricing is set-up for energy returned to the grid.
  #
  # Defaults to previous value when the imported total Wh is < 100.
  #
  - trigger:
      - platform: state
        entity_id: sensor.sa_todays_energy_exported_compensation
    sensor:
      - name: "Todays Energy Export Rate"
        unique_id: sa_todays_energy_export_rate
        unit_of_measurement: "$/kWh"
        device_class: "monetary"
        icon: mdi:cash-plus
        state: >-
          {%- set exported = states('sensor.sa_data_by_5min_exported_total')|float(0.0) -%}
          {%- set compensation = states('sensor.sa_todays_energy_exported_compensation')|float(0.0) -%}
          {%- set old = this.state|float(none) -%}
          {%- if exported > 0 -%}
            {%- if exported > 100 -%}
              {{- (compensation / exported * 1000.0)|float(0.0)|round(3) -}}
            {%- else -%}
              {{- old -}}
            {%- endif -%}
          {%- else -%}
            0.0
          {%- endif -%}
        attributes:
          state_class: "measurement"
          time_stamp: "{{- states('sensor.sa_data_by_5min_time_stamp_cached') -}}"
        availability: >-
          {{- states('sensor.sa_data_by_5min_exported_total')|float(0.0) > 0 -}}

# =============================================================================

